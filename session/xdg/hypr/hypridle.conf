# hypridle: idle -> lock -> dpms -> suspend.
#
# WHO OWNS THE LOCK. The shell's own lock surface (modules/ii/lock/LockSurface.qml) owns the
# screen: $lock_cmd asks it first, which is the path SUPER+L takes every day. hyprlock is the
# explicit FALLBACK for the case the shell cannot cover - it is dead or never started - because
# it is its own ext-session-lock process and so survives a shell crash. The other two places
# that choose pick in the same order: hyprland/keybinds.lua (SUPER+L) and hyprland/execs.lua at
# boot, where bootlock.qml goes first and hyprlock runs only if that left no ready marker.
# Setting lock.useHyprlock in the shell's config hands hyprlock the screen instead, everywhere.
#
# hyprctl dispatch takes a dispatcher name and args, NOT Lua source. An earlier version of this
# file passed 'hl.dsp.global("quickshell:lock")' as a string, which hyprctl rejects as an
# invalid dispatcher, so nothing ever locked.
#
# `pidof hyprlock ||` keeps a second instance from being spawned over the first.
$lock_cmd = qs -p $TACIT_SHELL ipc call lock activate || pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    # Must return promptly - hyprlock blocks until unlocked, so it is never run
    # synchronously here. loginctl emits Lock, which hypridle handles with $lock_cmd.
    before_sleep_cmd = loginctl lock-session
    # Hyprland 0.56 takes a Lua expression after `hyprctl dispatch`; the old `dpms on` form is refused
    # hl.dsp.dpms reads its action from a table: a bare string ("on") is a toggle, so waking turned the screen off
    # the second call gives the keyboard back to the lock surface; it is a no-op when unlocked
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' ; qs -p $TACIT_SHELL ipc call lock focus
    inhibit_sleep = 3
}

# The auto-lock. It was off between 2026-09-06 and 2026-09-28 because hyprlock was then an
# unverified locker; $lock_cmd now goes through the shell's own lock first, which is the same
# path SUPER+L uses every day. Without this listener the screen went black at 600s and stayed
# unlocked until the 900s suspend.
listener {
    timeout = 300 # 5mins
    # Call $lock_cmd directly rather than bouncing through logind -> Lock signal
    # -> back to hypridle. One fewer moving part between idle and a locked screen.
    on-timeout = $lock_cmd
}

listener {
    timeout = 600 # 10mins
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 900 # 15mins
    on-timeout = $suspend_cmd
}
