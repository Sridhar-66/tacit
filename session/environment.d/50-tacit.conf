# Tacit's own D-Bus services (Files' FileManager1, the keyring prompt) live in /usr/share/tacit/dbus-1/services and
# must win over other desktops' (Nautilus has a FileManager1 too): the user bus finds services through XDG_DATA_DIRS
# and starts before the session's own environment exists, so it is set here, for the user manager.
XDG_DATA_DIRS=/usr/share/tacit:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}
