<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Tacit's text for everyone (tacit-session, conf.d 49: after fontconfig's own defaults, before a person's
     ~/.config/fontconfig/fonts.conf at 50, which wins). The owner's file as of 2026-10-16; "browser" is Thyris's
     program name. -->
<fontconfig>
    <!-- 2026-10-02, the owner's pick from live samples ("C fully macOS"): text drawn as macOS draws it.
         Grey edges (no subpixel colour) and the letters exactly as designed (no hinting), with the
         edges blended in linear light: Qt Quick is patched for that (~/dev/tacit-text); foot's
         gamma-correct-blending was tried and reverted (black background under Hyprland). Until 2026-10-02 this was full hinting + RGB subpixel (set
         2026-09-18); that file is fonts.conf.bak-2026-10-02. -->
    <match target="font">
        <edit name="antialias" mode="assign">
            <bool>true</bool>
        </edit>
        <edit name="hinting" mode="assign">
            <bool>false</bool>
        </edit>
        <edit name="hintstyle" mode="assign">
            <const>hintnone</const>
        </edit>
        <edit name="rgba" mode="assign">
            <const>none</const>
        </edit>
        <edit name="lcdfilter" mode="assign">
            <const>lcdnone</const>
        </edit>
    </match>
    <!-- 2026-10-02, the owner's pick C from live samples: web pages in Opsis (drawn by its Chromium engine, which
         has no linear-light correction, so unhinted grey edges read blurry) get their heights snapped to pixels.
         Grey edges as everywhere; Opsis's own Qt text sets its hinting per item (PreferNoHinting) and stays as is. -->
    <match target="font">
        <test name="prgname" target="pattern" compare="eq"><string>browser</string></test>
        <edit name="hinting" mode="assign"><bool>true</bool></edit>
        <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    </match>
    <!-- 2026-10-15: Tacit Sans in pages is drawn as designed, not snapped: its bold "i" has its dot under a pixel above the
         stem at 16 px, and the snapping merged the two ("Crlmlnal Jlm", the owner: "text scratched out"). Other web fonts
         keep the snapped heights above. -->
    <match target="font">
        <test name="prgname" target="pattern" compare="eq"><string>browser</string></test>
        <test name="family"><string>Tacit Sans</string></test>
        <edit name="hinting" mode="assign"><bool>false</bool></edit>
        <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    </match>
    <match target="font">
        <test name="prgname" target="pattern" compare="eq"><string>QtWebEngineProcess</string></test>
        <edit name="hinting" mode="assign"><bool>true</bool></edit>
        <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    </match>
</fontconfig>
