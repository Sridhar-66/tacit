# The FALLBACK locker. The shell's own lock surface owns the screen (hypridle.conf says so in
# one place); hyprlock runs when the shell is not there to lock - it died, or a boot where
# bootlock.qml left no ready marker - and whenever lock.useHyprlock is set in the shell's config.
# It is kept because it is its own ext-session-lock process and survives a shell crash.
#
# hyprlock on the desktop's language. The wallpaper stays visible, blurred and dimmed; the
# notch pill at the top centre carries the time and the desktop's status glyph; a big clock
# and the date sit in the upper third; now playing (art + one line) and the unread count
# appear only when there is something; the password is a docked pill at the bottom centre
# with caps lock and the battery beside it; the power actions are clickable text in the
# bottom-right corner, where the control panel lives. Colours: hyprlock/colors.conf
# (matugen, from the shell's palette). Helpers: hyprlock/*.sh.

source = ~/.config/hypr/hyprlock/colors.conf
$H = /usr/share/tacit/hypr/hyprlock

general {
    hide_cursor = false
    ignore_empty_input = true
    # The boot lock: draw before every resource has arrived, never fade in. The first frame
    # must be the ground the splash and swaybg already show.
    immediate_render = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 0
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# The pre-rendered lock ground (mkassets.sh --ground): the exact pixels the boot splash held
# and swaybg shows, so this lock appearing changes nothing but the clock.
background {
    monitor =
    path = ~/.local/state/tacit-boot/lock-ground.png
    color = rgba(141314FF)
}

# ---------------------------------------------------------------- the notch
shape {
    monitor =
    zindex = -1
    size = 170, 62
    color = $panel_frost
    rounding = 18
    position = 0, 26
    halign = center
    valign = top
}
label { # time in the notch
    monitor =
    text = $TIME
    color = $text_color
    font_size = 15
    font_family = $font_family_clock
    position = -12, -6
    halign = center
    valign = top
}
label { # status glyph beside it, same order as the desktop
    monitor =
    text = cmd[update:5000] $H/glyph.sh
    color = $subtext_color
    font_size = 15
    font_family = $font_material_symbols
    position = 34, -7
    halign = center
    valign = top
}

# ---------------------------------------------------------------- clock and date
label {
    monitor =
    text = $TIME
    color = $text_color
    font_size = 84
    font_family = $font_family_clock
    position = 0, 190
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    color = $subtext_color
    font_size = 16
    font_family = $font_family
    position = 0, 118
    halign = center
    valign = center
}

# ---------------------------------------------------------------- now playing
image {
    monitor =
    path = $H/cache/blank.png
    size = 56
    rounding = 14
    border_size = 0
    reload_time = 2
    reload_cmd = $H/media-art.sh
    position = 0, 40
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:2000] $H/media.sh
    color = $text_color
    font_size = 13
    font_family = $font_family
    position = 0, -6
    halign = center
    valign = center
}

# ---------------------------------------------------------------- while you were away
label {
    monitor =
    text = cmd[update:5000] $H/away.sh
    color = $subtext_color
    font_size = 13
    font_family = $font_family
    position = 0, -50
    halign = center
    valign = center
}

# ---------------------------------------------------------------- who
label {
    monitor =
    text =   $USER
    color = $subtext_color
    font_size = 13
    font_family = $font_family
    position = 30, 30
    halign = left
    valign = bottom
}

# ---------------------------------------------------------------- the password pill
input-field {
    monitor =
    size = 340, 46
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    rounding = 23
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    check_color = $hairline
    fail_color = rgba(ffb4abFF)
    fail_text = <i>$FAIL</i>
    placeholder_text =
    fade_on_empty = false
    hide_input = false
    position = 0, 18
    halign = center
    valign = bottom
}
label { # caps lock, only when on
    monitor =
    text = cmd[update:250] $H/check-capslock.sh
    color = $subtext_color
    font_size = 11
    font_family = $font_family
    position = -270, 33
    halign = center
    valign = bottom
}
label { # battery
    monitor =
    text = cmd[update:5000] $H/status.sh
    color = $subtext_color
    font_size = 11
    font_family = $font_family
    position = 240, 33
    halign = center
    valign = bottom
}

# ---------------------------------------------------------------- power, bottom right
# The three actions in one frost pill, the control panel's corner (zindex -1 keeps the pill
# under its labels; without it the pill covered them, which read as grey-on-grey).
shape {
    monitor =
    zindex = -1
    size = 300, 40
    color = $panel_frost
    rounding = 20
    border_size = 1
    border_color = $hairline
    position = -20, 18
    halign = right
    valign = bottom
}
label {
    monitor =
    text = Sleep
    color = $text_color
    font_size = 14
    font_family = $font_family
    onclick = $H/power.sh sleep
    position = -232, 29
    halign = right
    valign = bottom
}
label {
    monitor =
    text = Restart
    color = $text_color
    font_size = 14
    font_family = $font_family
    onclick = $H/power.sh restart
    position = -142, 29
    halign = right
    valign = bottom
}
label {
    monitor =
    text = cmd[update:1000] $H/shutdown-label.sh
    color = $text_color
    font_size = 14
    font_family = $font_family
    onclick = $H/power.sh shutdown
    position = -40, 29
    halign = right
    valign = bottom
}
