# Tacit's login screen (sddm.conf.d, the package's): SDDM on Wayland in a kiosk compositor, Tacit's theme and cursor.
# No --xwayland=false: Weston 15 refuses it and the greeter never starts; Xwayland loads only with --xwayland.
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell,QT_QPA_PLATFORM=wayland
Numlock=none

[Wayland]
CompositorCommand=weston --shell=kiosk-shell.so
SessionDir=/usr/share/wayland-sessions

[Theme]
Current=tacit
CursorTheme=Tacit
